[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kontinuum-core"
# Version is derived from the Git tag by setuptools-scm (see [tool.setuptools_scm]
# below). Tagging `v0.6.1` and pushing it is now the single source of truth for
# the release version — no more manually bumping a hardcoded string, which is
# what silently left PyPI on 0.6.0 while the tag said 0.6.1.
dynamic = ["version"]
authors = [{name = "Chance-Konstruktion", email = "introareback@gmail.com"}]
description = "Neuro-inspired learning engine for anomaly detection"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Chance-Konstruktion/kontinuum-core"
Issues = "https://github.com/Chance-Konstruktion/kontinuum-core/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Write the resolved version to an importable file so runtime __version__ and
# the built package metadata always agree. The file is generated (git-ignored).
version_file = "src/kontinuum_core/_version.py"
# When built outside a Git checkout with no tags/metadata (rare — e.g. a bare
# source snapshot), fall back rather than hard-failing the build.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
